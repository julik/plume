inherit_from:
  - .rubocop/goodcop-tabs.yml

AllCops:
  TargetRubyVersion: 3.2
  SuggestExtensions: false

Layout/HashAlignment:
  Enabled: false

Layout/MultilineArrayLineBreaks:
  Enabled: false

Layout/ExtraSpacing:
  Enabled: false

Style/HashSyntax:
  Enabled: false

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/EndAlignment:
  EnforcedStyleAlignWith: keyword

Layout/MultilineAssignmentLayout:
  Enabled: false

Style/EmptyElse:
  AllowComments: true

Layout/SpaceAroundOperators:
  Enabled: false

Style/RaiseArgs:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Enabled: false

Layout/EmptyLineAfterMultilineCondition:
  Enabled: false

Layout/HeredocIndentation:
  Enabled: false

# The railroad diagrams of the SQLite grammar in parser.rb are drawn in comments
Layout/CommentIndentation:
  Exclude:
    - lib/plume/parser.rb

Layout/EmptyComment:
  Exclude:
    - lib/plume/parser.rb

# A `private` section reads better here than prefixing every helper
Style/AccessModifierDeclarations:
  EnforcedStyle: group

# A bare `return` from inside a search loop is how the resolver (and bin/grammar) bail out early
Lint/NonLocalExitFromIterator:
  Exclude:
    - lib/plume/analysis/resolver.rb
    - bin/grammar
